worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ---------------------------------------------------------------------------
  # Upstream clusters (round-robin is the default when no algorithm is set)
  # ---------------------------------------------------------------------------
  upstream user_cluster {
    server user-service:3001;
  }

  upstream event_cluster {
    server event-service-1:3002;
    server event-service-2:3002;
  }

  upstream booking_cluster {
    server booking-service:3003;
  }

  upstream notification_upstream {
    server notification-service:3004;
  }

  upstream frontend_upstream {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # App-level replica id (set by each Node service)
    proxy_pass_header X-Instance-Id;

    location /api/auth {
      proxy_pass http://user_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Served-By $upstream_addr always;
      add_header Access-Control-Expose-Headers "X-Served-By,X-Instance-Id,X-Cache" always;
    }

    location /api/events {
      proxy_pass http://event_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Served-By $upstream_addr always;
      add_header Access-Control-Expose-Headers "X-Served-By,X-Instance-Id,X-Cache" always;
    }

    location /api/bookings {
      proxy_pass http://booking_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Served-By $upstream_addr always;
      add_header Access-Control-Expose-Headers "X-Served-By,X-Instance-Id,X-Cache" always;
    }

    location /api/notifications {
      proxy_pass http://notification_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Served-By $upstream_addr always;
      add_header Access-Control-Expose-Headers "X-Served-By,X-Instance-Id" always;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
