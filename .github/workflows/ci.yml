name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    env:
      # Prisma generation validates that DATABASE_URL exists but does not connect.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: frontend
            path: frontend
          - name: user-service
            path: services/user-service
          - name: event-service
            path: services/event-service
          - name: booking-service
            path: services/booking-service
          - name: notification-service
            path: services/notification-service
    defaults:
      run:
        working-directory: ${{ matrix.package.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package.path }}/package-lock.json
      - run: npm ci
      - run: npm run build

  booking-concurrency:
    name: Booking concurrency tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookings_db
          POSTGRES_USER: ticketmaster
          POSTGRES_PASSWORD: ticketmaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketmaster -d bookings_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/booking-service
    env:
      DATABASE_URL: postgresql://ticketmaster:ticketmaster@127.0.0.1:5432/bookings_db
      TEST_DATABASE_URL: postgresql://ticketmaster:ticketmaster@127.0.0.1:5432/bookings_db
      TEST_REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: integration-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/booking-service/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm test
